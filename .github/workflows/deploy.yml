name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE_PATH: /web-app-calculate-badminton/
          # Repository variables (Settings → Secrets and variables → Actions →
          # Variables). Unset → the sign-in button stays hidden in prod.
          VITE_DUCKER_ISSUER: ${{ vars.VITE_DUCKER_ISSUER }}
          VITE_DUCKER_CLIENT_ID: ${{ vars.VITE_DUCKER_CLIENT_ID }}
          VITE_DUCKER_SCOPE: ${{ vars.VITE_DUCKER_SCOPE }}
          VITE_DUCKER_PROFILE_PATH: ${{ vars.VITE_DUCKER_PROFILE_PATH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

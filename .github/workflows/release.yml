name: Release on push to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags so we can find the latest version tag
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # manual markers are only honored in the HEAD commit subject, so
          # commit bodies that merely mention them (docs, changelogs) don't
          # trigger; the automatic bump is inferred from Conventional Commit
          # prefixes across every commit since the previous release
          subject=$(git log -1 --pretty=%s)
          if echo "$subject" | grep -qiF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
            # HEAD is already released (e.g. workflow re-run)
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            range="$latest..HEAD"
            if echo "$subject" | grep -qiF '[release major]'; then
              bump=major
            elif echo "$subject" | grep -qiF '[release minor]'; then
              bump=minor
            elif git log --pretty=%s "$range" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
              || git log --pretty=%B "$range" | grep -q 'BREAKING CHANGE'; then
              bump=major
            elif git log --pretty=%s "$range" | grep -qE '^feat(\([^)]*\))?:'; then
              bump=minor
            else
              bump=patch
            fi
            case "$bump" in
              major) next="v$((major+1)).0.0" ;;
              minor) next="v$major.$((minor+1)).0" ;;
              patch) next="v$major.$minor.$((patch+1))" ;;
            esac
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.next }}" \
            --generate-notes

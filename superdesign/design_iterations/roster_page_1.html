<!DOCTYPE html>
<!--
  Danh bạ người chơi — Desktop, khung mới.
  Header full chiều ngang; ô tìm kiếm lên cùng hàng tiêu đề (md:).
  Nhóm chữ chảy thành 2 cột (CSS columns, mỗi nhóm không bị cắt đôi); tiêu đề
  chữ cái thôi dính khi cuộn ở desktop vì 2 cột cuộn cùng nhau.
  Rail A–Z dính mép phải của cột 1024px; màn hẹp hơn thì dính mép màn hình.
  Mobile (<768px) không đổi.
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tính tiền cầu lông — Danh bạ (desktop)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="bg-gray-100 min-h-dvh">

<div class="mx-auto w-full max-w-[430px] bg-[#F2F2F7] min-h-dvh pb-[calc(2rem+env(safe-area-inset-bottom))] md:max-w-none md:bg-gray-100 md:pb-0">

  <header class="bg-emerald-600 px-4 pt-8 pb-4 rounded-b-3xl md:rounded-none md:px-0 md:py-5">
    <!-- flex-wrap: mobile = [←][tiêu đề][+] rồi ô tìm kiếm xuống hàng; md = [←][tiêu đề][tìm kiếm][+] -->
    <div class="flex flex-wrap items-center gap-3 md:mx-auto md:max-w-5xl md:flex-nowrap md:px-6">
      <button type="button" aria-label="Quay lại" class="h-11 w-11 shrink-0 rounded-xl bg-emerald-700 text-white flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </button>
      <div class="min-w-0 flex-1">
        <h1 class="text-xl font-bold text-white md:text-2xl">Danh bạ người chơi</h1>
        <p class="text-sm text-emerald-100">9 người đã lưu</p>
      </div>
      <div class="relative order-last mt-1 w-full md:order-none md:mt-0 md:w-80">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-emerald-100">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input type="search" placeholder="Tìm kiếm" class="h-11 w-full rounded-xl bg-emerald-700/60 pl-9 pr-9 text-base text-white placeholder:text-emerald-200 outline-none">
      </div>
      <button type="button" aria-label="Thêm vào danh bạ" class="h-11 w-11 shrink-0 rounded-full bg-emerald-700 text-white flex items-center justify-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <!-- md:pr-14 chừa chỗ cho rail A–Z khi màn chưa đủ rộng để rail nằm ngoài cột 1024px -->
  <main class="relative mt-3 md:mx-auto md:mt-0 md:max-w-5xl md:px-6 md:py-6 md:pr-14 min-[1136px]:pr-6">
    <p class="pb-2 text-center text-xs text-gray-400 md:pb-4">Bấm nút thùng rác đỏ để xóa</p>

    <div class="md:columns-2 md:gap-6">
      <!-- một nhóm chữ = một section, không bị cắt sang cột kia -->
      <section class="md:mb-4 md:break-inside-avoid">
        <h2 class="sticky top-0 z-10 bg-[#F2F2F7]/90 px-4 py-1 text-[13px] font-semibold uppercase tracking-wide text-gray-500 md:static md:bg-transparent md:px-0">A</h2>
        <ul class="mx-4 overflow-hidden rounded-xl bg-white shadow-sm md:mx-0">
          <li class="flex items-center gap-3 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">A</span><span class="flex-1 font-medium text-gray-900">An</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
          <li class="flex items-center gap-3 border-t border-gray-200 py-2.5 pl-3 pr-2 ml-0"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">A</span><span class="flex-1 font-medium text-gray-900">Anh Tú</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
        </ul>
      </section>
      <section class="md:mb-4 md:break-inside-avoid">
        <h2 class="sticky top-0 z-10 bg-[#F2F2F7]/90 px-4 py-1 text-[13px] font-semibold uppercase tracking-wide text-gray-500 md:static md:bg-transparent md:px-0">B</h2>
        <ul class="mx-4 overflow-hidden rounded-xl bg-white shadow-sm md:mx-0">
          <li class="flex items-center gap-3 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">B</span><span class="flex-1 font-medium text-gray-900">Bình</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
        </ul>
      </section>
      <section class="md:mb-4 md:break-inside-avoid">
        <h2 class="sticky top-0 z-10 bg-[#F2F2F7]/90 px-4 py-1 text-[13px] font-semibold uppercase tracking-wide text-gray-500 md:static md:bg-transparent md:px-0">H</h2>
        <ul class="mx-4 overflow-hidden rounded-xl bg-white shadow-sm md:mx-0">
          <li class="flex items-center gap-3 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-pink-100 text-pink-700 font-semibold flex items-center justify-center">H</span><span class="flex-1 font-medium text-gray-900">Hoa</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
          <li class="flex items-center gap-3 border-t border-gray-200 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">H</span><span class="flex-1 font-medium text-gray-900">Hùng</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
        </ul>
      </section>
      <section class="md:mb-4 md:break-inside-avoid">
        <h2 class="sticky top-0 z-10 bg-[#F2F2F7]/90 px-4 py-1 text-[13px] font-semibold uppercase tracking-wide text-gray-500 md:static md:bg-transparent md:px-0">L</h2>
        <ul class="mx-4 overflow-hidden rounded-xl bg-white shadow-sm md:mx-0">
          <li class="flex items-center gap-3 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-pink-100 text-pink-700 font-semibold flex items-center justify-center">L</span><span class="flex-1 font-medium text-gray-900">Lan</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
        </ul>
      </section>
      <section class="md:mb-4 md:break-inside-avoid">
        <h2 class="sticky top-0 z-10 bg-[#F2F2F7]/90 px-4 py-1 text-[13px] font-semibold uppercase tracking-wide text-gray-500 md:static md:bg-transparent md:px-0">M</h2>
        <ul class="mx-4 overflow-hidden rounded-xl bg-white shadow-sm md:mx-0">
          <li class="flex items-center gap-3 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">M</span><span class="flex-1 font-medium text-gray-900">Minh</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
        </ul>
      </section>
      <section class="md:mb-4 md:break-inside-avoid">
        <h2 class="sticky top-0 z-10 bg-[#F2F2F7]/90 px-4 py-1 text-[13px] font-semibold uppercase tracking-wide text-gray-500 md:static md:bg-transparent md:px-0">T</h2>
        <ul class="mx-4 overflow-hidden rounded-xl bg-white shadow-sm md:mx-0">
          <li class="flex items-center gap-3 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">T</span><span class="flex-1 font-medium text-gray-900">Tuấn</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
          <li class="flex items-center gap-3 border-t border-gray-200 py-2.5 pl-3 pr-2"><span class="h-10 w-10 rounded-full bg-emerald-50 text-emerald-700 font-semibold flex items-center justify-center">T</span><span class="flex-1 font-medium text-gray-900">Thắng</span><span class="h-11 w-11 flex items-center justify-center text-gray-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class="h-11 w-11 flex items-center justify-center text-red-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></li>
        </ul>
      </section>
    </div>

    <!-- rail A–Z: mép phải cột 1024px, không trôi ra mép cửa sổ -->
    <div class="fixed right-1 top-1/2 z-20 flex -translate-y-1/2 flex-col items-center rounded-full bg-white/70 py-1 backdrop-blur-sm md:right-[max(0.25rem,calc(50vw-560px))]">
      <span class="h-7 w-11 text-center text-[11px] font-semibold leading-7 text-emerald-600">A</span>
      <span class="h-7 w-11 text-center text-[11px] font-semibold leading-7 text-emerald-600">B</span>
      <span class="h-7 w-11 text-center text-[11px] font-semibold leading-7 text-emerald-600">H</span>
      <span class="h-7 w-11 text-center text-[11px] font-semibold leading-7 text-emerald-600">L</span>
      <span class="h-7 w-11 text-center text-[11px] font-semibold leading-7 text-emerald-600">M</span>
      <span class="h-7 w-11 text-center text-[11px] font-semibold leading-7 text-emerald-600">T</span>
    </div>

    <p class="px-4 pt-6 text-center text-xs text-gray-400">Danh bạ tự bổ sung khi bạn thêm người chơi mới trong buổi</p>
  </main>
</div>
</body>
</html>
